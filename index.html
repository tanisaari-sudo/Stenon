*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid #111}
h2 .num{display:inline-block;min-width:24px;color:#888;font-weight:400}
.wrap{padding:12px 12px 0}

/* ---- верхняя панель ---- */
.top{
  position:sticky;top:0;z-index:20;background:#111;color:#fff;
  padding:8px 12px;display:flex;align-items:center;gap:10px;
}
.top .t-title{font-weight:600;font-size:16px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}
.clock.paused{color:#ffb020}
.tbtn{
  background:#fff;color:#111;border:0;border-radius:8px;
  padding:9px 13px;font-size:15px;font-weight:600;
}
.tbtn.ghost{background:#333;color:#fff}

/* ---- кнопки ---- */
button{font-family:inherit}
.big{
  display:block;width:100%;padding:17px;margin:10px 0;
  font-size:18px;font-weight:600;border:0;border-radius:12px;
  background:#111;color:#fff;
}
.big.sec{background:#eceae6;color:#111}
.big.danger{background:#fff;color:#a11;border:2px solid #a11}
.row2{display:flex;gap:8px}
.row2>*{flex:1}

/* ---- чипы ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 4px}
.chip{
  border:2px solid #c9c5be;background:#fff;color:#111;
  border-radius:10px;padding:11px 13px;font-size:15px;line-height:1.15;
  min-height:46px;text-align:left;
}
.chip.on{background:#111;color:#fff;border-color:#111}
.chip .hint{display:block;font-size:12px;color:#6b6b6b;margin-top:3px}
.chip.on .hint{color:#c9c9c9}
.chip.aux{border-style:dashed;color:#444;font-weight:600}
.more{display:none;padding:8px;margin:4px 0;background:#f5f3f0;border-radius:10px}
.more.open{display:block}
label.f{display:block;font-weight:600;margin:14px 0 5px;font-size:15px}
label.f .sub{font-weight:400;color:#777;font-size:13px}

/* ---- поля ---- */
input[type=text],input[type=number],textarea{
  width:100%;padding:13px;font-size:17px;font-family:inherit;
  border:2px solid #c9c5be;border-radius:10px;background:#fff;color:#111;
}
textarea{min-height:84px;resize:vertical}
.pair{display:flex;align-items:center;gap:8px}
.pair span{color:#777;font-size:15px}

/* ---- список слоёв / шурфов ---- */
.card{
  border:2px solid #ddd9d3;border-radius:12px;padding:12px;margin:8px 0;
  display:flex;align-items:center;gap:10px;
}
.card .n{font-size:22px;font-weight:700;min-width:38px}
.card .m{flex:1;min-width:0;font-size:14px;color:#555}
.card .m b{display:block;color:#111;font-size:16px;font-weight:600}
.card .go{background:#eceae6;border:0;border-radius:8px;padding:10px 12px;font-size:15px}
.counter{background:#f5f3f0;border-radius:12px;padding:12px;text-align:center;
  font-size:15px;color:#555}
.counter b{font-size:26px;display:block;color:#111}
.note{font-size:13px;color:#777;margin:6px 0}
.warn{background:#fff5e0;border-left:4px solid #e0a020;padding:10px;

/* Проба хранилища. Если файл открыт через content:// (так его отдаёт файловый
   менеджер Android), localStorage может быть недоступен, и записи молча пропадут.
   Тогда показываем красную полосу на каждом экране. */
var storageOK = (function(){
  try{
    localStorage.setItem("__probe__","1");
    var ok = localStorage.getItem("__probe__")==="1";
    localStorage.removeItem("__probe__");
    return ok;
  }catch(e){ return false; }
})();

var S = load();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { shurfy: [], custom: {}, plan: 97 };
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    flash();

    alert("НЕ СОХРАНИЛОСЬ: "+e.message+"\nСрочно выгрузите данные через «Экспорт».");
  }
}
var flashT;
function flash(){
  var el=document.getElementById("saved");
  el.classList.add("show");
  clearTimeout(flashT);
  flashT=setTimeout(function(){el.classList.remove("show");},700);
}

/* ================================================================
   НАВИГАЦИЯ
   ================================================================ */
var view = {name:"list", si:null, li:null};

function go(name, si, li){
  view = {name:name, si:(si===undefined?view.si:si), li:(li===undefined?view.li:li)};
  render();
  window.scrollTo(0,0);
}
function cur(){ return S.shurfy[view.si]; }

/* ================================================================
   ТАЙМЕР
   ================================================================ */
function tState(sh){
  if(!sh) return {ms:0, run:false, pause:0};
  var t = sh.timer;
  var ms = t.acc;
  if(t.startedAt) ms += Date.now() - t.startedAt;
  var p = t.pauseAcc;
  if(t.pausedAt) p += Date.now() - t.pausedAt;
  return {ms:ms, run:!!t.startedAt, pause:p, started:!!(t.acc||t.startedAt)};
}
function fmt(ms){
  var s = Math.floor(ms/1000);
  var m = Math.floor(s/60), h = Math.floor(m/60);
  s%=60; m%=60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");
}
function timerStart(){
  var sh=cur(); if(!sh) return;
  if(sh.timer.startedAt) return;
  if(sh.timer.pausedAt){ sh.timer.pauseAcc += Date.now()-sh.timer.pausedAt; sh.timer.pausedAt=0; }
  sh.timer.startedAt = Date.now();
  wakeOn(); save(); tick();
}
function timerPause(){
  var sh=cur(); if(!sh||!sh.timer.startedAt) return;
  sh.timer.acc += Date.now()-sh.timer.startedAt;
  sh.timer.startedAt = 0;
  sh.timer.pausedAt = Date.now();
  save(); tick();
}
function timerStop(){
  var sh=cur(); if(!sh) return;
  if(sh.timer.startedAt){ sh.timer.acc += Date.now()-sh.timer.startedAt; sh.timer.startedAt=0; }
  if(sh.timer.pausedAt){ sh.timer.pauseAcc += Date.now()-sh.timer.pausedAt; sh.timer.pausedAt=0; }
  wakeOff(); save();
}
var tickT;
function tick(){
  clearTimeout(tickT);
  var c=document.getElementById("clock"), b=document.getElementById("timerBtn");
  var sh = (view.name==="list"||view.name==="export") ? null : cur();
  if(!sh){ c.textContent=""; b.classList.add("hidden"); return; }
  var t=tState(sh);
  b.classList.remove("hidden");
  c.textContent = fmt(t.ms);
  c.className = "clock" + (t.run?"":" paused");
  b.textContent = t.run ? "пауза" : (t.started ? "пуск" : "старт");
  b.onclick = t.run ? timerPause : timerStart;
  if(t.run) tickT=setTimeout(tick,1000);
}

/* Экран не гаснет. Работает только в защищённом контексте (https);
   с карты памяти по file:// молча не сработает — выставьте тайм-аут экрана в настройках. */
var wl=null;
function wakeOn(){
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(x){wl=x;},function(){}); }catch(e){}
}
function wakeOff(){ try{ if(wl){wl.release(); wl=null;} }catch(e){} }
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){
    var sh=(view.name==="list"||view.name==="export")?null:cur();
    if(sh && sh.timer.startedAt) wakeOn();
    tick();
  }
});

function newShurf(num){
  return {

    timer:{acc:0,startedAt:0,pauseAcc:0,pausedAt:0},
    conditions:[], layers:[],
    relief:"",water:"",exposure:"",slope:"",
    surface:"",vegType:"",vegCover:"",vegDom:"",moisture:"",disturb:"",
    shurfSize:"1×1 м",oriented:true,wall:"",
    totalDepth:"",thaw:"",ggv:"",stopReason:"",
    cultural:"нет",finds:0,extraShots:[],fatigue:"",recult:false,note:"",
    closed:false

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function isOn(val, v, multi){
  return multi ? (val||[]).indexOf(v)>=0 : val===v;
}

/* какие блоки «ещё» сейчас раскрыты — переживает перерисовку */
var openMore = {};

/* поле выбора: key — путь к свойству объекта, vocab — имя словаря */
function pick(label, key, vocabName, multi, sub){
  var vc = V[vocabName];
  var obj = target();
  var val = obj[key];
  var custom = S.custom[vocabName]||[];
  /* выбранное из «ещё» показываем и в основном ряду: иначе выбор не виден,
     когда блок свёрнут */
  var chosen = multi ? (val||[]) : (val?[val]:[]);
  var raised = chosen.filter(function(t){
    return vc.main.indexOf(t)<0 && custom.indexOf(t)<0;
  });
  var h = '<label class="f">'+esc(label)+(sub?' <span class="sub">'+esc(sub)+'</span>':'')+'</label>';
  h += '<div class="chips">';
  vc.main.concat(custom).concat(raised).forEach(function(t){
    h += '<button class="chip'+(isOn(val,t,multi)?' on':'')+'" data-pick="'+esc(key)+
         '" data-val="'+esc(t)+'" data-multi="'+(multi?1:0)+'">'+esc(t)+'</button>';
  });
  if(vc.more.length)
    h += '<button class="chip aux" data-more="'+esc(vocabName)+'">ещё ▾</button>';
  h += '<button class="chip aux" data-own="'+esc(vocabName)+'" data-key="'+esc(key)+
       '" data-multi="'+(multi?1:0)+'">своё +</button>';
  h += '</div>';
  if(vc.more.length){
    h += '<div class="more'+(openMore[vocabName]?' open':'')+'" data-morebox="'+esc(vocabName)+'"><div class="chips">';
    vc.more.forEach(function(p){
      h += '<button class="chip'+(isOn(val,p[0],multi)?' on':'')+'" data-pick="'+esc(key)+
           '" data-val="'+esc(p[0])+'" data-multi="'+(multi?1:0)+'">'+esc(p[0])+
           (p[1]?'<span class="hint">'+esc(p[1])+'</span>':'')+'</button>';
    });
    h += '</div></div>';
  }
  return h;
}

/* ================================================================
   СБОРКА СТРОКИ В ФОРМАТЕ ПОЛЕМОНА (только для экспорта)
   ================================================================ */
/* согласование по роду: «супесь бежевая, рыхлая» вместо «супесь бежевый, рыхлый».
   Работает только с прилагательными; существительные под шаблон не попадают. */
function isFem(head){
  var w=(head||"").split(/[\s,]+/)[0]||"";
  return /(ь|а|я)$/.test(w);
}
function femize(s){
  /* \b в JS не работает после кириллицы — конец слова ловим отрицательным просмотром */
  return String(s).replace(/([А-Яа-яЁё]+?)(ый|ой|ий)(?![А-Яа-яЁё])/g, function(m, stem, end){
    if(end==="ий") return stem + (/[гкхжшчщ]$/.test(stem) ? "ая" : "яя");
    return stem + "ая";
  });
}
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function polemonLine(L){
  var p=[];
  var g=L.granulo.join(", ");
  var fem=isFem(g);
  var col=fem?femize(L.color):L.color;
  var mods=L.colorMod.map(function(x){return fem?femize(x):x;});
  var head=[g,col].filter(Boolean).join(" ");
  if(mods.length) head += ", " + mods.join(", ");
  if(head) p.push(cap(head)+".");
  var dw=[L.density,L.wet].filter(Boolean).map(function(x){return fem?femize(x):x;}).join(", ");
  if(dw) p.push(cap(dw)+".");
  if(L.aggr) p.push(L.aggr==="агрегаты не выражены" ? "Агрегаты не выражены."
    : ("Агрегаты: "+[L.aggrSize,L.aggr,L.aggrExpr].filter(Boolean).join(" ")+"."));
  if(L.texture){
    var tx="Текстура "+L.texture;
    if(L.interChar||L.interMm)
      tx+=", выражена отчётливо: "+(L.interChar||"прослойки")+
          (L.interMm?" шириной "+L.interMm+" мм":"");
    p.push(tx+".");
  }
  if(L.incl.length){
    if(L.incl.indexOf("включений нет")>=0) p.push("Включений нет.");
    else p.push("Включения: "+L.incl.join(", ")+
      (L.rootsDiam?", диаметром "+L.rootsDiam+" мм":"")+
      (L.inclAbund?", "+L.inclAbund:"")+
      (L.inclDistr?", "+L.inclDistr:"")+".");
  }
  if(L.newform.length && L.newform.indexOf("новообразований нет")<0)
    p.push("Новообразования: "+L.newform.join(", ")+".");
  if(L.hcl) p.push("Вскипает от HCl.");
  if(L.last) p.push("Слой однороден по составу на всю видимую мощность.");
  else if(L.bndSharp||L.bndForm)
    p.push("Нижняя граница "+[L.bndSharp.replace(/\s*\(.*?\)/,""),L.bndForm]
      .filter(Boolean).join(", ")+".");
  return p.join(" ");
}

        L.rootsDiam,L.inclAbund,L.inclDistr,L.newform,L.hcl?"да":"нет",
        L.last?"да":"нет",L.bndSharp,L.bndForm,L.thickFrom,L.thickTo,
        L.depthFrom,L.depthTo,L.note,polemonLine(L)]
        : new Array(COLS.length-head.length).fill("");
      rows.push(head.concat(tail).map(cell).join(";"));
    });
  });
  return rows.join("\r\n");
}
function download(name, text, mime){
  try{
    var b=new Blob(["﻿"+text],{type:mime+";charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  }catch(e){
    alert("Скачивание не сработало. Нажмите «Показать CSV» и скопируйте текст.");
  }
}

/* ================================================================
   СОБЫТИЯ
   ================================================================ */
document.getElementById("backBtn").onclick=function(){
  if(view.name==="layer"||view.name==="finish") go("shurf");
  else go("list");
};

document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;

  if(b.dataset.pick!==undefined){
    var k=b.dataset.pick, v=b.dataset.val, multi=b.dataset.multi==="1";
    var o=target();
    if(multi){
      var arr=o[k]||[]; var i=arr.indexOf(v);
      if(i>=0) arr.splice(i,1); else arr.push(v);
      o[k]=arr;
    } else {
      o[k] = (o[k]===v ? "" : v);
    }
    save(); render(); return;
  }
  if(b.dataset.more!==undefined){
    var vn0=b.dataset.more;
    openMore[vn0]=!openMore[vn0];
    var boxes=document.querySelectorAll('[data-morebox="'+vn0+'"]');
    for(var i=0;i<boxes.length;i++) boxes[i].classList.toggle("open", openMore[vn0]);
    return;
  }
  if(b.dataset.own!==undefined){
    var vn=b.dataset.own, key=b.dataset.key, m=b.dataset.multi==="1";
    var val=prompt("Своё значение:");
    if(val){
      val=val.trim();
      S.custom[vn]=S.custom[vn]||[];
      if(S.custom[vn].indexOf(val)<0) S.custom[vn].push(val);
      var o2=target();
      if(m){ o2[key]=o2[key]||[]; if(o2[key].indexOf(val)<0) o2[key].push(val); }
      else o2[key]=val;
      save(); render();
    }
    return;
  }
  if(b.dataset.bool!==undefined){
    target()[b.dataset.bool] = b.dataset.b==="1";
    save(); render(); return;
  }

  var act=b.dataset.act;
  if(!act) return;

  if(act==="new"){
    var n=prompt("Номер шурфа (как в Locus Map):");
    if(!n) return;
    n=n.trim();
    if(S.shurfy.some(function(x){return x.num===n;}) &&
       !confirm("Шурф "+n+" уже есть. Всё равно завести ещё один?")) return;
    S.shurfy.push(newShurf(n)); save();
    go("shurf", S.shurfy.length-1);
  }
  else if(act==="open"){ go("shurf", +b.dataset.i); }
  else if(act==="start"){ timerStart(); render(); }
  else if(act==="addlayer"){
    var sh=cur();
    if(!tState(sh).started) timerStart();
    sh.layers.push(newLayer(sh.layers[sh.layers.length-1]));
    save(); go("layer", view.si, sh.layers.length-1);
  }
  else if(act==="layer"){ go("layer", view.si, +b.dataset.i); }
  else if(act==="toshurf"){ go("shurf"); }
  else if(act==="dellayer"){
    if(confirm("Удалить слой "+(view.li+1)+"? Отменить нельзя.")){
      cur().layers.splice(view.li,1); save(); go("shurf");
    }
  }
  else if(act==="finish"){ timerPause(); go("finish"); }
  else if(act==="close"){
    timerStop(); cur().closed=true; save(); go("list");
  }
  else if(act==="export"){ go("export"); }
  else if(act==="dlcsv"){ download("stenon-"+stamp()+".csv", buildCSV(), "text/csv"); }
  else if(act==="dljson"){ download("stenon-"+stamp()+".json", JSON.stringify(S,null,1), "application/json"); }
  else if(act==="showcsv"){ var t1=document.getElementById("exportBox"); t1.value=buildCSV(); t1.select(); }
  else if(act==="showjson"){ var t2=document.getElementById("exportBox"); t2.value=JSON.stringify(S,null,1); t2.select(); }
  else if(act==="wipe"){
    if(confirm("Стереть ВСЁ? Сначала выгрузите данные.") &&
       confirm("Точно? Это необратимо.")){
      S={shurfy:[],custom:{},plan:97}; save(); go("list");
    }
  }
});

/* ввод чисел и текста — сохраняем на каждый ввод */
document.getElementById("app").addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset.num!==undefined){ target()[el.dataset.num]=el.value; save(); }
  else if(el.dataset.txt!==undefined){ target()[el.dataset.txt]=el.value; save(); }
});

function stamp(){
  var d=new Date(), p=function(x){return String(x).padStart(2,"0");};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes());
}

window.addEventListener("beforeunload",function(){ save(); });

render();
